name: Deploy BRIFAN TECH to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build website
        env:
          VITE_SUPABASE_URL: https://htjzmsajubsyvacynyht.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_FkbYCnsJZZmfQucGfqBTLA_lc2l0eSo
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: brifan-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./dist

      - name: Cancel stale Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          stale_sha="f45357ae54c6809353c600858d5c3ec4deef5c13"
          response_code="$(curl --silent --show-error --output /tmp/pages-cancel-response.json --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/${stale_sha}/cancel")"
          if [[ "$response_code" == "204" || "$response_code" == "404" ]]; then
            echo "Stale Pages deployment cancellation handled (HTTP $response_code)."
          else
            cat /tmp/pages-cancel-response.json
            echo "Unexpected response while cancelling stale Pages deployment: HTTP $response_code"
            exit 1
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: brifan-pages-${{ github.run_id }}-${{ github.run_attempt }}
