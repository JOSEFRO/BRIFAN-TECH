name: Validate BRIFAN TECH

on:
  push:
    branches: [mejora-visual]
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - '.github/workflows/validate.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build website
        env:
          VITE_SUPABASE_URL: https://htjzmsajubsyvacynyht.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_FkbYCnsJZZmfQucGfqBTLA_lc2l0eSo
        run: npm run build
