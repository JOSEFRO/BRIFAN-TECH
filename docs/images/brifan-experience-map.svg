<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570"><rect width="1200" height="570" rx="24" fill="#080e1b"/><text x="58" y="70" fill="#fff" font-family="Arial" font-size="34" font-weight="700">BRIFAN TECH · recorrido del usuario</text><text x="58" y="108" fill="#a9b7cc" font-family="Arial" font-size="18">Mapa conceptual de las áreas principales de la plataforma.</text><g font-family="Arial"><rect x="60" y="165" width="250" height="300" rx="18" fill="#141f34" stroke="#ff596b"/><text x="185" y="225" text-anchor="middle" fill="#ff7d8c" font-size="30">01</text><text x="185" y="275" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Explorar</text><text x="185" y="320" text-anchor="middle" fill="#c1cde0" font-size="17">Categorías, búsqueda</text><text x="185" y="350" text-anchor="middle" fill="#c1cde0" font-size="17">y recursos técnicos.</text><rect x="350" y="165" width="250" height="300" rx="18" fill="#141f34" stroke="#ff596b"/><text x="475" y="225" text-anchor="middle" fill="#ff7d8c" font-size="30">02</text><text x="475" y="275" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Aprender</text><text x="475" y="320" text-anchor="middle" fill="#c1cde0" font-size="17">Guías, rutas y artículos</text><text x="475" y="350" text-anchor="middle" fill="#c1cde0" font-size="17">con contenido multimedia.</text><rect x="640" y="165" width="250" height="300" rx="18" fill="#141f34" stroke="#ff596b"/><text x="765" y="225" text-anchor="middle" fill="#ff7d8c" font-size="30">03</text><text x="765" y="275" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Compartir</text><text x="765" y="320" text-anchor="middle" fill="#c1cde0" font-size="17">Publicar, comentar</text><text x="765" y="350" text-anchor="middle" fill="#c1cde0" font-size="17">y guardar favoritos.</text><rect x="930" y="165" width="210" height="300" rx="18" fill="#241724" stroke="#ff596b"/><text x="1035" y="225" text-anchor="middle" fill="#ff7d8c" font-size="30">04</text><text x="1035" y="275" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Gestionar</text><text x="1035" y="320" text-anchor="middle" fill="#e4c8d1" font-size="17">Perfil, ajustes</text><text x="1035" y="350" text-anchor="middle" fill="#e4c8d1" font-size="17">y moderación.</text></g><path d="M310 315h40m250 0h40m250 0h40" stroke="#ff7280" stroke-width="3" stroke-dasharray="6 7"/></svg>